name: Deploy to GitHub Pages

# Buildea la demo y la publica en GitHub Pages en cada push a main.
# Para activarlo: Settings -> Pages -> Source: "GitHub Actions".
# Asume que el repo se llama "pampa-demo" (de ahí el base path). Si lo nombrás
# distinto, cambiá NEXT_PUBLIC_BASE_PATH abajo por "/<nombre-del-repo>".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /pampa-demo
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
